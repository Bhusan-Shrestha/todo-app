services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tododb
      POSTGRES_USER: todo
      POSTGRES_PASSWORD: todo-access
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo -d tododb"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - local-app-net

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - local-app-net

  migrate:
    build:
      context: ./backend
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: todo
      PGPASSWORD: todo-access
      PGDATABASE: tododb
    depends_on:
      postgres:
        condition: service_healthy
    command: npm run migrate
    networks:
      - local-app-net

  backend:
    build:
      context: ./backend
    ports:
      - "4000:4000"
    environment:
      PORT: "4000"
      NODE_ENV: development
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: todo
      PGPASSWORD: todo-access
      PGDATABASE: tododb
      REDIS_URL: redis://redis:6379
      SESSION_TTL_SECONDS: "604800"
      FRONTEND_ORIGIN: http://localhost:3000
      API_ORIGIN: http://localhost:4000
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - local-app-net

volumes:
  postgres-data:
  redis-data:

networks:
  local-app-net:
    driver: bridge
